<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>
        Gerenciador de Tarefas Acadêmicas — Quadro de Projetos
    </title>
</head>

<body>

    <header>
        <h1>
            Gerenciador de Tarefas Acadêmicas
        </h1>
    </header>


    <main>

        <!-- BUSCA E FILTROS -->

        <section aria-labelledby="filtros-heading">

            <h2 id="filtros-heading">
                Busca e filtros
            </h2>


            <!-- MENSAGEM DE STATUS -->

            <div
                id="status"
                role="status"
                aria-live="polite"
            ></div>


            <form id="form-filtros">

                <!-- BUSCA -->

                <div>

                    <label for="busca">
                        Buscar por título da tarefa
                    </label>

                    <input
                        type="search"
                        id="busca"
                        name="busca"
                        placeholder="Digite o título da tarefa..."
                    >

                </div>


                <!-- STATUS -->

                <div>

                    <label for="filtro-status">
                        Filtrar por status
                    </label>

                    <select
                        id="filtro-status"
                        name="filtro-status"
                    >

                        <option value="todos">
                            Todos
                        </option>

                        <option value="afazer">
                            A fazer
                        </option>

                        <option value="andamento">
                            Em andamento
                        </option>

                        <option value="revisao">
                            Em revisão
                        </option>

                        <option value="concluida">
                            Concluída
                        </option>

                    </select>

                </div>


                <!-- PRIORIDADE -->

                <div>

                    <label for="filtro-prioridade">
                        Filtrar por prioridade
                    </label>

                    <select
                        id="filtro-prioridade"
                        name="filtro-prioridade"
                    >

                        <option value="todas">
                            Todas
                        </option>

                        <option value="baixa">
                            Baixa
                        </option>

                        <option value="media">
                            Média
                        </option>

                        <option value="alta">
                            Alta
                        </option>

                    </select>

                </div>


                <!-- ORDENAÇÃO -->

                <div>

                    <label for="ordenacao">
                        Ordenar por prazo
                    </label>

                    <select
                        id="ordenacao"
                        name="ordenacao"
                    >

                        <option value="nenhuma">
                            Sem ordenação
                        </option>

                        <option value="mais-proximo">
                            Prazo mais próximo
                        </option>

                        <option value="mais-distante">
                            Prazo mais distante
                        </option>

                    </select>

                </div>


                <!-- LIMPAR -->

                <button
                    type="button"
                    id="limpar-filtros"
                >
                    Limpar filtros
                </button>

            </form>

        </section>


        <!-- A FAZER -->

        <section aria-labelledby="coluna-afazer-heading">

            <h2 id="coluna-afazer-heading">
                A fazer
            </h2>

            <ul id="lista-afazer"></ul>

        </section>


        <!-- EM ANDAMENTO -->

        <section aria-labelledby="coluna-andamento-heading">

            <h2 id="coluna-andamento-heading">
                Em andamento
            </h2>

            <ul id="lista-andamento"></ul>

        </section>


        <!-- EM REVISÃO -->

        <section aria-labelledby="coluna-revisao-heading">

            <h2 id="coluna-revisao-heading">
                Em revisão
            </h2>

            <ul id="lista-revisao"></ul>

        </section>


        <!-- CONCLUÍDA -->

        <section aria-labelledby="coluna-concluida-heading">

            <h2 id="coluna-concluida-heading">
                Concluída
            </h2>

            <ul id="lista-concluida"></ul>

        </section>

    </main>


    <footer>

        <p>
            Raquel Aires — Desenvolvimento Frontend, 2026.2
        </p>

    </footer>


    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
